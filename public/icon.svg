<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E12" />
      <stop offset="60%" stop-color="#08321F" />
      <stop offset="100%" stop-color="#0E4B2F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E19C" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA822A" />
      <stop offset="100%" stop-color="#E2BD5A" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
  </defs>

  <!-- Background with subtle luxury border -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.65" />

  <!-- Architectural Foundation & Cable Bridge Emblem -->
  <g transform="translate(56, 70)">
    <!-- Base Foundation Line -->
    <path d="M 30 290 L 370 290" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 60 306 L 340 306" stroke="#FFFFFF" stroke-width="3" opacity="0.8" stroke-linecap="round" />

    <!-- Left Pillar (A) -->
    <path d="M 60 280 L 140 40 L 175 40 L 210 150 L 170 150 L 157 110 L 105 280 Z" fill="url(#goldGrad)" />
    <!-- Horizontal A Crossbar -->
    <path d="M 98 220 L 165 220" stroke="#08321F" stroke-width="12" stroke-linecap="round" />

    <!-- Cable Stayed Bridge Arches (R R A) -->
    <!-- Suspension Cable Curves -->
    <path d="M 157 40 Q 240 180 340 280" fill="none" stroke="#FFFFFF" stroke-width="4.5" opacity="0.9" />
    <path d="M 157 90 Q 230 190 300 280" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" />
    <path d="M 157 140 Q 210 210 260 280" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.75" />
    <path d="M 157 190 Q 190 235 220 280" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Right Pillar Structural Element -->
    <path d="M 280 280 L 320 140 L 348 140 L 370 280 L 340 280 L 332 235 L 298 235 L 290 280 Z" fill="url(#goldGrad)" />

    <!-- Central Diamond Foundation Accent -->
    <polygon points="200,20 216,42 200,64 184,42" fill="url(#goldGrad)" />
  </g>

  <!-- ARRA Typographic Mark -->
  <text x="256" y="440" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">ARRA</text>
  <text x="256" y="475" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="19" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">INFRASTRUCTURE</text>
</svg>
